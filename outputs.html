<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCO Creative Output View</title>
<style>
:root{--p:#71188e;--ink:#24202a;--muted:#706a76;--line:#ddd7e3;--bg:#f6f4f8;--soft:#f2eaf5;--drop:#9c94a2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img.logo{height:34px;max-width:220px;object-fit:contain}
.brand img.mascot{height:58px;max-width:120px;object-fit:contain;margin:-8px 0 -14px}
h1{margin:0;color:var(--p);font-size:22px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;font:inherit}
button{font-weight:700;cursor:pointer}
button.primary{background:var(--p);color:#fff;border-color:var(--p)}
main{padding:18px 22px 36px}
.controls{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:14px}
.summary{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--p);padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800}
.group{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
.grouphead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.grouphead h2{font-size:16px;margin:0 0 3px;color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;padding:14px}
.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.size{font-weight:800;color:var(--p)} .filename{font-family:ui-monospace,Consolas,monospace;font-size:9px;color:var(--muted);overflow-wrap:anywhere}
.stage-wrap{display:flex;align-items:center;justify-content:center;background:#faf9fb;border-radius:8px;height:185px;padding:10px}
.stage{position:relative;border:2px solid #bfb8c6;background:#eeeaf1;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;color:#746d78;font-size:9px}
.imagezone{position:absolute;inset:0;background:linear-gradient(135deg,#ded9e2,#f0edf2);display:flex;align-items:center;justify-content:center;color:#777;font-size:8px;text-align:center;padding:3px}
.imagezone img{width:100%;height:100%;object-fit:cover;opacity:.75}
.messagezone{display:none}
.msg{background:#efe6f4;border-left:3px solid var(--p);height:9px;min-height:6px;padding:0;font-size:0;overflow:hidden}
.msg.required{background:#eadcf1;border-left-width:4px}
.logozone{position:absolute;left:0;right:0;bottom:10px;height:8px;background:var(--p);font-size:0}
.legalzone{position:absolute;left:0;right:0;bottom:0;height:10px;background:#f8f7f9;border-top:1px solid #e4e0e6;font-size:0;overflow:hidden}


.meta{font-size:10px;color:var(--muted);line-height:1.35}
.drop{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;font-size:10px}
.drop strong{color:#6f6875}
.drop ul{margin:4px 0 0 16px;padding:0}
.drop li{margin:2px 0;color:var(--drop)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dot.req{background:#eadcf1;border-left:3px solid var(--p)} .dot.opt{background:#efe6f4;border-left:3px solid var(--p)} .dot.legal{background:#f8f7f9;border:1px solid var(--line)}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:760px){
  header{position:static;padding:12px}
  .top{align-items:flex-start}
  .brand{width:100%}
  .brand img.logo{height:30px;max-width:150px}
  .brand img.mascot{height:46px;max-width:80px}
  h1{font-size:20px}
  .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .actions button{width:100%;font-size:12px;padding:8px}
  main{padding:12px}
  .controls{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .grouphead .sub{font-size:11px}
  .stage-wrap{height:150px}
  .filename{display:none}
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}}

.compare-note{font-size:10px;color:var(--muted);line-height:1.3}
.keepdrop{display:flex;gap:6px;flex-wrap:wrap;font-size:10px}
.keepdrop span{padding:3px 6px;border-radius:999px;background:#f4f0f6}
.keepdrop .keep{color:var(--p);font-weight:800}
.keepdrop .dropchip{color:#777}
.filename{font-family:ui-monospace,Consolas,monospace;font-size:8.5px;color:var(--muted);overflow-wrap:anywhere;max-width:125px;text-align:right}
.grouphead .brief{display:none}
.scale-key{font-size:10px;color:var(--muted);padding:0 14px 12px}

</style>
</head>
<body>
<header><div class="top">
<div class="brand">
<img class="logo" src="assets/Sparklight(R)-purple-rgb.png" alt="Sparklight" onerror="this.style.display='none'">
<img class="mascot" src="assets/HeaderMascot.png" alt="" onerror="this.style.display='none'">
<div><h1>Creative Output View</h1><div class="sub">See what survives at each size before production.</div></div>
</div>
<div class="actions">
<button onclick="location.href='index.html?ts='+Date.now()">Back to Builder</button>
<button onclick="document.getElementById('csvFile').click()">Load DCO_Builder.csv</button>
<input id="csvFile" type="file" accept=".csv" style="display:none">
</div>
</div></header>

<main>
<div class="summary">
<div><span class="pill">SIZE LOGIC PREVIEW</span> Compare the actual proportions of each ad size. Shapes are schematic only; the chips below show what content survives.</div>
<div class="sub">Same-scale comparison by channel</div>
</div>

<div class="controls">
<input id="search" placeholder="Search execution or variation..." oninput="render()">
<select id="channel" onchange="render()"><option value="">All channels</option><option>Display</option><option>Social</option><option>Landing Page</option><option>Email</option></select>
<select id="status" onchange="render()"><option value="Current">Current only</option><option value="">All statuses</option><option>Future</option><option>Retired</option></select>
<select id="density" onchange="render()"><option value="balanced">Balanced size logic</option><option value="strict">Stricter small-size logic</option></select>
</div>

<div id="output"></div>
</main>

const SIZESETS={
  'Display':['160x600','300x50','300x250','300x600','320x50','728x90','970x90','970x250'],
  'Social':['1920x1080','1350x1080','1080x1080'],
  'Landing Page':['Custom'],
  'Email':['Custom']
};

const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function safe(s){return String(s||'').trim().replace(/-/g,' ').replace(/[^A-Za-z0-9 ]+/g,' ').replace(/\s+/g,'_').replace(/^_+|_+$/g,'')}
function sameCode(a,b){return safe(a).toLowerCase()===safe(b).toLowerCase()}

function filenameFor(r,size){
  const ec=r.Execution_Code||'TBD', vc=r.Variation_Code||'TBD';
  const base=`DCO-${safe(r.Channel)}_${safe(size)}-${safe(ec)}`;
  return sameCode(ec,vc)?base:`${base}-${safe(vc)}`;
}

function sizeRule(channel,size,density){
  if(channel==='Social'){
    if(size==='1920x1080') return {cap:density==='strict'?4:5,legal:'Full'};
    if(size==='1350x1080') return {cap:density==='strict'?4:5,legal:'Full'};
    if(size==='1080x1080') return {cap:density==='strict'?3:4,legal:'Full'};
  }
  if(channel==='Display'){
    const map={
      '300x600':{cap:5,legal:'Full'},
      '970x250':{cap:5,legal:'Full'},
      '300x250':{cap:density==='strict'?3:4,legal:'Short'},
      '160x600':{cap:density==='strict'?3:4,legal:'Short'},
      '728x90':{cap:2,legal:'Short'},
      '970x90':{cap:2,legal:'Short'},
      '320x50':{cap:1,legal:'Short'},
      '300x50':{cap:1,legal:'Short'}
    };
    return map[size]||{cap:3,legal:'Short'};
  }
  return {cap:5,legal:'Full'};
}

function dimensions(channel,size){
  if(size==='Custom') return [140,90];
  const m=String(size).match(/(\d+)x(\d+)/);
  if(!m) return [140,90];

  const w=+m[1], h=+m[2];

  // Use one scale per channel so shapes can be compared to each other,
  // rather than independently scaling every ad to fill its card.
  if(channel==='Display'){
    const scale=Math.min(220/970,145/600);
    return [Math.max(18,Math.round(w*scale)),Math.max(10,Math.round(h*scale))];
  }

  if(channel==='Social'){
    const scale=Math.min(220/1920,145/1080);
    return [Math.max(40,Math.round(w*scale)),Math.max(40,Math.round(h*scale))];
  }

  const scale=Math.min(200/w,130/h);
  return [Math.max(60,Math.round(w*scale)),Math.max(40,Math.round(h*scale))];
}
function priorityItems(r){
  const out=[];
  for(let i=1;i<=5;i++){
    const text=String(r['Message_'+i]||'').trim();
    if(!text)continue;
    out.push({priority:i,text,required:String(r['Message_'+i+'_Required']||'0')==='1'});
  }
  return out;
}

function retainedFor(r,size){
  const density=document.getElementById('density').value;
  const rule=sizeRule(r.Channel,size,density);
  const all=priorityItems(r);
  const required=all.filter(x=>x.required);
  const optional=all.filter(x=>!x.required);
  const keep=[...required];
  for(const item of optional) if(keep.length<rule.cap) keep.push(item);
  keep.sort((a,b)=>a.priority-b.priority);
  const ids=new Set(keep.map(x=>x.priority));
  const dropped=all.filter(x=>!ids.has(x.priority));
  return {keep,dropped,rule};
}

function card(r,size){
  const result=retainedFor(r,size);
  const [w,h]=dimensions(r.Channel,size);

  const img=r.Image_Asset
    ? `<img src="${E(r.Image_Asset)}" onerror="this.parentElement.textContent='AD SHAPE'">`
    : 'AD SHAPE';

  const kept=result.keep.map(x=>x.priority);
  const dropped=result.dropped.map(x=>x.priority);

  const keepText=kept.length ? `Keeps ${kept.join(', ')}` : 'No messages';
  const dropText=dropped.length ? `Drops ${dropped.join(', ')}` : 'Drops none';

  return `<div class="card">
    <div class="cardtop">
      <div>
        <div class="size">${E(size)}</div>
        <div class="compare-note">${w}×${h}px preview</div>
      </div>
      <div class="filename">${E(filenameFor(r,size))}</div>
    </div>

    <div class="stage-wrap">
      <div class="stage" style="width:${w}px;height:${h}px">
        <div class="imagezone">${img}</div>
        <div class="logozone"></div>
        <div class="legalzone"></div>
      </div>
    </div>

    <div class="keepdrop">
      <span class="keep">${keepText}</span>
      <span>${E(result.rule.legal)} legal</span>
      <span class="dropchip">${dropText}</span>
    </div>
  </div>`;
}
function group(r){
  let sizes=r.Size==='Full Set'?(SIZESETS[r.Channel]||['Custom']):[r.Size];
  if(!sizes.length)sizes=['Custom'];
  return `<section class="group">
    <div class="grouphead">
      <div><h2>${E(r.Record_ID)} · ${E(r.Execution)} — ${E(r.Variation)}</h2>
      <div class="sub">${E(r.Channel)} · ${E(r.Pillar)} · ${E(r.Status)}</div></div>
    </div>
    <div class="scale-key">Shapes use the same scale within each channel so the size and aspect-ratio differences are directly comparable.</div>
    <div class="grid">${sizes.map(s=>card(r,s)).join('')}</div>
  </section>`;
}

function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const ch=document.getElementById('channel').value;
  const st=document.getElementById('status').value;
  let rows=data.filter(r=>(!ch||r.Channel===ch)&&(!st||r.Status===st)&&(!q||(`${r.Execution} ${r.Variation} ${r.Record_ID}`).toLowerCase().includes(q)));
  document.getElementById('output').innerHTML=rows.length?rows.map(group).join(''):'<div class="empty">No creative executions match this view.</div>';
}

function parseCSV(t){
  let R=[],r=[],f='',q=false;
  for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else{if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));R.push(r);r=[];f=''}else f+=c}}
  if(f.length||r.length){r.push(f);R.push(r)}
  const h=(R.shift()||[]).map(x=>x.replace(/^\ufeff/,''));
  return R.filter(x=>x.some(v=>v)).map(x=>Object.fromEntries(h.map((c,i)=>[c,x[i]??''])));
}
document.getElementById('csvFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const parsed=parseCSV(await f.text());
  if(parsed.length){
    data=parsed;
    try{localStorage.setItem(DATA_KEY,JSON.stringify(data))}catch(e){}
  }
  render();e.target.value='';
});

// When hosted beside DCO_Builder.csv, prefer that live file.
// If the browser blocks fetch (for example file://), the embedded snapshot is used.
let hasWorkingData=false;
try{hasWorkingData=!!localStorage.getItem(DATA_KEY)}catch(e){}
if(!hasWorkingData){
  fetch('DCO_Builder.csv?ts='+Date.now())
    .then(r=>r.ok?r.text():Promise.reject())
    .then(t=>{const p=parseCSV(t);if(p.length){data=p;render()}})
    .catch(()=>{});
}
render();

function reloadWorkingData(){
  try{
    const saved=localStorage.getItem(DATA_KEY);
    if(saved){
      const parsed=JSON.parse(saved);
      if(Array.isArray(parsed) && parsed.length){
        data=parsed;
      }
    }
  }catch(e){}
  render();
}
window.addEventListener('pageshow',()=>reloadWorkingData());
window.addEventListener('storage',e=>{
  if(e.key===DATA_KEY) reloadWorkingData();
});

</script>
